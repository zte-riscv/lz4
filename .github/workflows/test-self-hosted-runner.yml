name: Test Self-Hosted RISC-V Runner

on:
  push:
    branches:
      - '**' # 监听所有分支的 push
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

jobs:
  verify-runner:
    name: Verify My RISC-V Runner
    # 根据你注册时的 --labels 参数，这里使用精确匹配
    runs-on: [self-hosted, linux, riscv64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print System Information
        run: |
          echo "=== OS Information ==="
          uname -a
          
          echo "=== CPU Information ==="
          # 尝试使用 lscpu，如果没有则退网查看 cpuinfo
          lscpu || cat /proc/cpuinfo
          
          echo "=== Memory Information ==="
          free -h || cat /proc/meminfo

      - name: Verify Workspace
        run: |
          echo "=== Workspace Information ==="
          echo "Current workspace: $GITHUB_WORKSPACE"
          ls -la

      - name: Print Success Message
        run: |
          echo "🎉 成功！The self-hosted runner (my-riscv-runner) is working perfectly!"
